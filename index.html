<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Datos de transferencia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;
    --surface:#121B2E;
    --surface-2:#17233A;
    --paper:#F6F1E4;
    --gold:#E3B65C;
    --gold-dim:#B4913F;
    --slate:#8B96AA;
    --line:rgba(227,182,92,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #1a2740 0%, transparent 55%),
      radial-gradient(circle at 90% 110%, #1a2740 0%, transparent 55%),
      var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .ticket{
    width:100%;
    max-width:400px;
    position:relative;
  }
  .card{
    background:var(--surface);
    border-radius:22px 22px 0 0;
    padding:34px 30px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
    border:1px solid rgba(227,182,92,0.12);
    border-bottom:none;
  }
  .route{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--gold-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    margin-bottom:22px;
  }
  .route .dots{
    flex:1;
    height:1px;
    background:repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 10px);
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    color:var(--paper);
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--slate);
    font-size:13.5px;
    margin:0 0 26px;
  }
  .field{
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .field:last-of-type{border-bottom:none;}
  .field-text{min-width:0;}
  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--gold-dim);
    margin-bottom:5px;
  }
  .value{
    font-family:'IBM Plex Mono', monospace;
    font-size:19px;
    color:var(--paper);
    font-weight:500;
    word-break:break-word;
  }
  .value.name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:21px;
  }
  .copy-btn{
    flex-shrink:0;
    width:34px;
    height:34px;
    border-radius:9px;
    background:var(--surface-2);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s ease, transform .15s ease;
  }
  .field:active .copy-btn{transform:scale(0.92);}
  .copy-btn svg{width:15px;height:15px;stroke:var(--gold);}
  .copy-btn.copied{background:var(--gold);}
  .copy-btn.copied svg{stroke:var(--ink);}

  .perforation{
    position:relative;
    height:26px;
    background:var(--surface);
  }
  .perforation::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0; bottom:14px;
    background:repeating-linear-gradient(90deg, transparent 0 6px, transparent 6px 10px);
  }
  .holes{
    position:absolute;
    top:-1px; left:0; right:0;
    height:14px;
    background-image: radial-gradient(circle 7px, var(--ink) 99%, transparent 100%);
    background-repeat:repeat-x;
    background-position: 0 0;
    background-size:24px 14px;
  }
  .dash{
    position:absolute;
    top:14px; left:20px; right:20px;
    border-top:1.5px dashed rgba(227,182,92,0.35);
  }

  .stub{
    background:var(--surface);
    border-radius:0 0 22px 22px;
    padding:22px 30px 30px;
    text-align:center;
    border:1px solid rgba(227,182,92,0.12);
    border-top:none;
  }
  .stub .icon{
    width:38px;height:38px;
    margin:0 auto 12px;
    border-radius:50%;
    background:rgba(227,182,92,0.1);
    display:flex;align-items:center;justify-content:center;
  }
  .stub .icon svg{width:18px;height:18px;stroke:var(--gold);}
  .stub p{
    color:var(--paper);
    font-family:'Fraunces', serif;
    font-size:16px;
    line-height:1.5;
    margin:0 0 4px;
  }
  .stub span{
    display:block;
    color:var(--slate);
    font-size:12.5px;
    margin-top:6px;
  }
  .toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--gold);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:10px 18px;
    border-radius:999px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="ticket">
  <div class="card">
    <div class="route">PAGO <span class="dots"></span> VIAJE</div>
    <h1>Datos de transferencia</h1>
    <p class="subtitle">Toca cualquier dato para copiarlo</p>

    <div class="field" data-copy="Maikol Illanes">
      <div class="field-text">
        <div class="label">Nombre</div>
        <div class="value name">Maikol Illanes</div>
      </div>
      <div class="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
    </div>

    <div class="field" data-copy="21.072.550-4">
      <div class="field-text">
        <div class="label">RUT</div>
        <div class="value">21.072.550-4</div>
      </div>
      <div class="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
    </div>

    <div class="field" data-copy="Mercado Pago">
      <div class="field-text">
        <div class="label">Banco</div>
        <div class="value">Mercado Pago</div>
      </div>
      <div class="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
    </div>

    <div class="field" data-copy="Vista">
      <div class="field-text">
        <div class="label">Tipo de cuenta</div>
        <div class="value">Vista</div>
      </div>
      <div class="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
    </div>

    <div class="field" data-copy="1062579677">
      <div class="field-text">
        <div class="label">Número de cuenta</div>
        <div class="value">1062579677</div>
      </div>
      <div class="copy-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </div>
    </div>
  </div>

  <div class="perforation"><div class="holes"></div><div class="dash"></div></div>

  <div class="stub">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.75l-6.16 3.24 1.18-6.88L2 9.24l6.92-1L12 2l3.08 6.24 6.92 1-5.02 4.87 1.18 6.88z"/></svg>
    </div>
    <p>¡Gracias por tu viaje!</p>
    <span>Si todo fue de tu agrado, una buena calificación significa mucho para mí 🙏</span>
  </div>
</div>

<div class="toast" id="toast">Copiado</div>

<script>
  const toast = document.getElementById('toast');
  let toastTimer;
  document.querySelectorAll('.field').forEach(field => {
    field.addEventListener('click', async () => {
      const text = field.getAttribute('data-copy');
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const btn = field.querySelector('.copy-btn');
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 900);

      toast.textContent = 'Copiado: ' + text;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    });
  });
</script>

</body>
</html>
